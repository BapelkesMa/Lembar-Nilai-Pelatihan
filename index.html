<style>

<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ===================== KONFIGURASI ===================== */
/* Tempel URL Web App Google Apps Script di sini (berakhiran /exec) */
const API_URL = '';
/* ======================================================= */

const app = document.getElementById('app');
const S = { list:null, listErr:null, view:'home', cur:null, doc:null,
  tab:'pengaturan', kSel:null, drafts:{}, toast:null,
  pending:null, inflight:false, saving:'idle', saveErr:'', savedAt:null, busy:false, seq:0 };
const JENIS = ['Penugasan','Studi Kasus','Roleplay','Praktik','Presentasi','Simulasi','Diskusi Kelompok','Rencana Tindak Lanjut'];
const DEF_PRED = [{batas:null,label:'Kurang Memuaskan'},{batas:70,label:'Cukup Memuaskan'},{batas:80,label:'Memuaskan'},{batas:90,label:'Sangat Memuaskan'}];
const PRED_COL = ['var(--red)','var(--amber)','var(--teal)','var(--green)'];
const isP = () => true;
const canNil = () => true;
const canEdit = k => true;

/* ---------- helpers ---------- */
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = x => typeof x === 'number' && isFinite(x);
const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,6);
const fmt = (n,d=2) => isNum(n) ? n.toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}) : '–';
const fmtIn = n => isNum(n) ? String(Math.round(n*100)/100).replace('.',',') : '';
const parseNum = s => { s = String(s ?? '').trim().replace(/\s/g,'').replace(',','.'); if(s==='') return null; const n = Number(s); return isFinite(n) ? n : NaN; };
const list = m => Object.entries(m || {}).filter(([,v]) => v && typeof v === 'object').map(([id,v]) => ({...v, id})).sort((a,b) => (a.urut ?? 0) - (b.urut ?? 0) || a.id.localeCompare(b.id));
const nest = (path, val) => path.split('/').reduceRight((acc,k) => ({[k]:acc}), val);
function deepMerge(a, b){
  const out = (a && typeof a === 'object' && !Array.isArray(a)) ? {...a} : {};
  for (const [k,v] of Object.entries(b)) {
    out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(out[k], v) : v;
  }
  return out;
}
const stat = arr => { const a = arr.filter(isNum); if(!a.length) return {min:null,max:null,avg:null,n:0}; return {min:Math.min(...a),max:Math.max(...a),avg:a.reduce((s,x)=>s+x,0)/a.length,n:a.length}; };
function toast(msg){ S.toast = msg; paintToast(); clearTimeout(toast.t); toast.t = setTimeout(()=>{ S.toast=null; paintToast(); }, 3200); }
function paintToast(){ let el = document.getElementById('toast'); if(!S.toast){ el && el.remove(); return; } if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent = S.toast; }

/* ---------- server ---------- */
async function api(req){
  let r;
  try { r = await fetch(API_URL, {method:'POST', body: JSON.stringify(req)}); }
  catch(e){ throw new Error('Tidak terhubung ke server. Periksa koneksi internet.'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('Jawaban server tidak terbaca. Periksa URL Web App.'); }
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan di server.');
  return j;
}
async function loadList(){
  if (!API_URL) { S.list = []; render(); return; }
  try { const j = await api({action:'list'}); S.list = j.list; S.listErr = null; }
  catch(e){ S.listErr = e.message; if (!S.list) S.list = []; }
  render();
}
async function enter(id){
  S.busy = true; render();
  try {
    const j = await api({action:'get', id});
    S.cur = id; S.doc = j.doc; S.view = 'doc'; S.drafts = {}; S.tab = 'pengaturan'; S.saving = 'idle';
    try { history.replaceState(null, '', '#' + id); } catch(e){}
    window.scrollTo(0,0);
  } catch(e){ toast(e.message); }
  S.busy = false; render();
}
function leave(){ S.cur = null; S.doc = null; S.view = 'home'; S.pending = null; S.saving = 'idle'; try { history.replaceState(null, '', location.pathname); } catch(e){} loadList(); window.scrollTo(0,0); }

/* write queue: optimistic local change, then sequential saves */
function upd(obj){
  if (!S.doc) return;
  S.doc = deepMerge(S.doc, obj);
  S.pending = S.pending ? deepMerge(S.pending, obj) : obj;
  render(); flush();
}
async function flush(){
  if (S.inflight || !S.pending || !S.cur) return;
  const patch = S.pending; S.pending = null; S.inflight = true; S.saving = 'saving'; S.seq++; paintStatus();
  try {
    const j = await api({action:'save', id:S.cur, patch});
    S.doc = S.pending ? deepMerge(j.doc, S.pending) : j.doc;
    S.saving = 'saved'; S.savedAt = new Date();
  } catch(e){
    S.pending = S.pending ? deepMerge(patch, S.pending) : patch;
    S.saving = 'error'; S.saveErr = e.message; toast('Belum tersimpan: ' + e.message);
    clearTimeout(flush.t); flush.t = setTimeout(() => { if (S.saving === 'error') flush(); }, 8000);
  }
  S.inflight = false; render();
  if (S.pending && S.saving !== 'error') flush();
}
async function poll(){
  if (!S.cur || !S.doc || S.pending || S.inflight || document.visibilityState !== 'visible') return;
  const seq = S.seq;
  try {
    const j = await api({action:'get', id:S.cur});
    if (seq === S.seq && !S.pending && !S.inflight) { S.doc = j.doc; render(); }
  } catch(e){ if (/tidak ditemukan/i.test(e.message)) { toast('Pelatihan ini sudah dihapus.'); leave(); } }
}
setInterval(poll, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
window.addEventListener('beforeunload', e => {
  if (S.pending || S.inflight || S.saving === 'error' || Object.keys(S.drafts).length) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- calculation ---------- */
function hitung(d){
  const B = d.bobot || {post:30,pen:70,had:0};
  const bp=(+B.post||0)/100, bt=(+B.pen||0)/100, bk=(+B.had||0)/100;
  const pred = (Array.isArray(d.predikat) && d.predikat.length===4) ? d.predikat : DEF_PRED;
  const lulus = isNum(d.lulus) ? d.lulus : 70;
  const hadMin = isNum(d.hadirMin) ? d.hadirMin : null;
  const kom = list(d.komponen).filter(k => (k.kode||'').trim() || (k.nama||'').trim()).map(k => ({...k, w: isNum(k.bobot) ? k.bobot : 1}));
  const pes = list(d.peserta).filter(p => (p.nama||'').trim());
  const needHad = bk>0 || hadMin!==null;
  const rows = pes.map((p,i) => {
    const pre = isNum(p.pre)?p.pre:null, post = isNum(p.post)?p.post:null, had = isNum(p.hadir)?p.hadir:null;
    const prog = (pre!==null && post!==null && pre<100) ? (post-pre)/(100-pre)*100 : null;
    const vals = kom.map(k => { const v = d.nilai && d.nilai[k.id] && d.nilai[k.id][p.id]; return isNum(v)?v:null; });
    let s=0, sw=0; vals.forEach((v,j) => { if(v!==null && kom[j].w>0){ s+=v*kom[j].w; sw+=kom[j].w; } });
    const pen = sw>0 ? s/sw : null;
    let na = null;
    if (!((bp>0&&post===null)||(bt>0&&pen===null)||(bk>0&&had===null))) na = Math.round(((post||0)*bp + (pen||0)*bt + (had||0)*bk)*100)/100;
    let pi = null, predikat = '';
    if (na!==null){ pi = [1,2,3].filter(j => isNum(pred[j].batas) && pred[j].batas < na).length; predikat = pred[pi].label; }
    const status = na===null ? '' : ((na > lulus && (hadMin===null || (had||0) >= hadMin)) ? 'Lulus' : 'Tidak Lulus');
    const miss = kom.filter((k,j) => k.w>0 && vals[j]===null).length + (pre===null) + (post===null) + (needHad && had===null);
    return {no:i+1, p, pre, post, had, prog, vals, pen, na, pi, predikat, status, miss};
  });
  rows.forEach(r => { r.rank = r.na===null ? null : 1 + rows.filter(o => o.na!==null && o.na > r.na).length; });
  const best = rows.filter(r => r.status==='Lulus').sort((a,b) => b.na-a.na || (b.post||0)-(a.post||0) || a.no-b.no).slice(0, Math.max(1, Math.min(10, d.nTop||3)));
  const cols = {pre: stat(rows.map(r=>r.pre)), post: stat(rows.map(r=>r.post)), prog: stat(rows.map(r=>r.prog)),
    kom: kom.map((k,j) => stat(rows.map(r=>r.vals[j]))), pen: stat(rows.map(r=>r.pen)), had: stat(rows.map(r=>r.had)), na: stat(rows.map(r=>r.na))};
  const dist = pred.map((x,i) => rows.filter(r => r.pi===i).length);
  const totalB = (+B.post||0)+(+B.pen||0)+(+B.had||0);
  return {kom, pes, rows, best, cols, dist, pred, lulus, hadMin, B, totalB, needHad};
}

/* ---------- views ---------- */
function statusPill(){
  if (S.view !== 'doc') return '';
  if (S.saving === 'saving' || S.inflight) return '<span class="pill" id="st">Menyimpan…</span>';
  if (S.saving === 'error') return '<button class="pill warn" id="st" data-a="retry" style="border:0;cursor:pointer">Belum tersimpan, coba lagi</button>';
  if (S.saving === 'saved' && S.savedAt) return `<span class="pill ok" id="st">✓ Tersimpan ${S.savedAt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span>`;
  return '<span class="pill" id="st">Tersambung</span>';
}
function paintStatus(){ const el = document.getElementById('st'); if (el) el.outerHTML = statusPill(); }
function header(){
  return `<header class="top"><div class="wrap">
    <button class="brand" data-a="home" aria-label="Kembali ke daftar pelatihan"><span class="mark" aria-hidden="true">${'<i></i>'.repeat(9)}</span><span>Lembar Nilai Pelatihan<small>Bapelkes Mataram</small></span></button>
    <span class="spacer"></span>
    ${statusPill()}
    ${S.view==='doc' ? `<button class="btn sm" data-a="export">Unduh Excel</button><button class="btn ghost sm" data-a="logout">Daftar pelatihan</button>` : ''}
  </div></header>`;
}
function viewHome(){

const ro = k => canEdit(k) ? '' : ' disabled';
function inp(key, val, opt={}){
  const v = (key in S.drafts) ? S.drafts[key] : (opt.num ? fmtIn(val) : (val ?? ''));
  const cls = 'in' + (opt.num ? ' num' : '') + (opt.cls ? ' '+opt.cls : '');
  return `<input class="${cls}" data-k="${h(key)}" data-t="${opt.num?'num':'txt'}"${opt.max!==undefined?` data-max="${opt.max}"`:''} value="${h(v)}"${opt.ph?` placeholder="${h(opt.ph)}"`:''}${opt.list?` list="${opt.list}"`:''} aria-label="${h(opt.label||key)}"${opt.num?' inputmode="decimal"':''}${ro(key)}>`;
}

function viewPelatihan(){
  const pid = S.cur, d = S.doc; const c = hitung(d);
  const tabs = [['pengaturan','Pengaturan'],['peserta','Data Peserta', c.rows.length],['nilai','Nilai Fasilitator', c.kom.length],['rekap','Rekap'],['ringkasan','Ringkasan']];
  const nP = c.rows.length;
  const ledger = c.kom.map((k,j) => {
    const f = c.rows.filter(r => r.vals[j]!==null).length;
    return `<button class="lg${nP && f===nP?' done':''}" data-a="goK" data-id="${h(k.id)}" title="${h(k.nama)}"><b><span class="kode">${h(k.kode||'MP')}</span> ${h(k.jenis||'')}</b>
      <span class="cells" aria-hidden="true">${c.rows.slice(0,60).map(r => `<i class="${r.vals[j]!==null?'on':''}"></i>`).join('')}</span>
      <span>${f} dari ${nP} terisi${k.fasilitator?' • '+h(k.fasilitator):''}</span></button>`;
  }).join('');
  const pf = c.rows.filter(r => r.pre!==null && r.post!==null).length;
  const panitia = `<button class="lg${nP && pf===nP?' done':''}" data-a="tab" data-id="peserta"><b><span class="kode">Panitia</span> Pre/Post Test</b>
      <span class="cells" aria-hidden="true">${c.rows.slice(0,60).map(r => `<i class="${r.pre!==null&&r.post!==null?'on':''}"></i>`).join('')}</span><span>${pf} dari ${nP} terisi</span></button>`;
  let body = '';
  if (S.tab==='pengaturan') body = tabPengaturan(pid,d,c);
  else if (S.tab==='peserta') body = tabPeserta(pid,d,c);
  else if (S.tab==='nilai') body = tabNilai(pid,d,c);
  else if (S.tab==='rekap') body = tabRekap(pid,d,c);
  else body = tabRingkasan(pid,d,c);
  return `<main><div class="wrap">
    <h1>${h(d.judul || 'Tanpa judul')}</h1>
    <div class="muted">${h([d.penyelenggara, d.tanggal, d.tempat].filter(Boolean).join(' | ') || 'Lengkapi identitas pelatihan di tab Pengaturan')}</div>
    ${nP ? `<div class="ledger">${panitia}${ledger}</div>` : ''}
    <nav class="tabs" role="tablist">${tabs.map(([k,l,n]) => `<button role="tab" aria-selected="${S.tab===k}" data-a="tab" data-id="${k}">${l}${n!==undefined?`<span class="cnt">${n}</span>`:''}</button>`).join('')}</nav>
    ${body}
  </div></main>`;
}

  <div class="grid2">
    <section class="panel"><h2>Peserta terbaik</h2><p class="small muted">Dari peserta yang lulus. Bila nilai akhir sama, Post Test lebih tinggi didahulukan.</p>
      ${c.best.length ? `<ol class="podium">${c.best.map((r,i) => `<li><span class="rk">${i+1}</span><div><b>${h(r.p.nama)}</b><div class="small muted">${h(r.p.instansi||'')} • Post ${fmt(r.post)} • Penugasan ${fmt(r.pen)}</div></div><span class="sc">${fmt(r.na)}</span></li>`).join('')}</ol>`
        : '<p class="muted">Belum ada peserta dengan nilai akhir lengkap.</p>'}
    </section>
    <section class="panel"><h2>Distribusi predikat</h2><p class="small muted">${nNA} peserta dengan nilai akhir lengkap.</p>
      <div class="dist" role="img" aria-label="Distribusi predikat">${dist.filter(x=>x.n).map(x => `<i style="flex:${x.n};background:${x.col}" title="${h(x.p.label)}: ${x.n}">${x.n}</i>`).join('') || '<i style="flex:1;background:var(--line)"></i>'}</div>
      <div class="scroll"><table><thead><tr><th>Predikat</th><th>Rentang</th><th class="c">Jumlah</th><th class="c">%</th></tr></thead><tbody>
      ${dist.slice().reverse().map((x,ri) => { const i = 3-ri; return `<tr><td><span class="legend"><span style="--c:${x.col}">${h(x.p.label)}</span></span></td><td class="small">${brange(i)}</td><td class="c">${x.n}</td><td class="c">${nNA?fmt(x.n/nNA*100,1)+'%':'–'}</td></tr>`; }).join('')}
      </tbody></table></div>
    </section>
  </div>
  <section class="panel"><h2>Statistik per komponen</h2>
    <div class="scroll"><table><thead><tr><th>Komponen</th><th class="c">Terendah</th><th class="c">Tertinggi</th><th class="c">Rata-rata</th></tr></thead><tbody>
    ${statRow('Pre Test',c.cols.pre)}${statRow('Post Test',c.cols.post)}${statRow('Progress (%)',c.cols.prog)}
    ${c.kom.map((k,j) => statRow(`<span class="kode">${h(k.kode)}</span> ${h(k.jenis||'')}`, c.cols.kom[j], h(k.nama))).join('')}
    ${statRow('Rata-rata Penugasan',c.cols.pen)}${statRow('Kehadiran (%)',c.cols.had)}${statRow('Nilai Akhir',c.cols.na,'',true)}
    </tbody></table></div>
  </section></div>`;
}

/* ---------- render ---------- */
function render(){
  const a = document.activeElement, key = a && a.dataset && (a.dataset.k || (a.dataset.pred!==undefined ? 'pred'+a.dataset.pred+a.dataset.f : null));
  const ss = a && a.selectionStart, se = a && a.selectionEnd;
  const scrolls = {}; app.querySelectorAll('[data-scroll]').forEach(el => scrolls[el.dataset.scroll] = el.scrollLeft);
  const paste = {}; app.querySelectorAll('textarea[id]').forEach(t => paste[t.id] = t.value);
  const open = {}; app.querySelectorAll('details.paste').forEach((dt,i) => open[i] = dt.open);
  const formVals = {}; app.querySelectorAll('form[data-form] [name]').forEach(el => formVals[el.closest('form').dataset.form+':'+el.name] = el.value);
  const focusName = a && a.name && a.closest && a.closest('form[data-form]') ? a.closest('form').dataset.form+':'+a.name : null;
  const body = (S.view==='doc' && S.doc) ? viewPelatihan() : S.view==='new' ? viewNew() : viewHome();
  app.innerHTML = header() + body;
  app.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollLeft = scrolls[el.dataset.scroll]; });
  app.querySelectorAll('textarea[id]').forEach(t => { if (paste[t.id]) t.value = paste[t.id]; });
  app.querySelectorAll('details.paste').forEach((dt,i) => { if (open[i] !== undefined) dt.open = open[i]; });
  app.querySelectorAll('form[data-form] [name]').forEach(el => { const k = el.closest('form').dataset.form+':'+el.name; if (formVals[k] !== undefined) el.value = formVals[k]; if (k === focusName) el.focus(); });
  if (key) {
    const el = key.startsWith('pred') && !app.querySelector(`[data-k="${CSS.escape(key)}"]`)
      ? app.querySelector(`[data-pred="${key[4]}"][data-f="${key.slice(5)}"]`)
      : app.querySelector(`[data-k="${CSS.escape(key)}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch(e){} }
  }
}

/* ---------- events ---------- */
app.addEventListener('input', e => { const k = e.target.dataset.k; if (k) S.drafts[k] = e.target.value; });
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.in') && !e.target.closest('form')) {
    e.preventDefault();
    let nextKey = null;
    const td = e.target.closest('td'), tr = td && td.parentElement;
    if (tr && tr.nextElementSibling) { const ni = tr.nextElementSibling.children[td.cellIndex]; const nx = ni && ni.querySelector('input.in[data-k]:not([disabled])'); if (nx) nextKey = nx.dataset.k; }
    if (!nextKey) { const all = [...app.querySelectorAll('input.in[data-k]:not([disabled])')]; const nx = all[all.indexOf(e.target)+1]; if (nx) nextKey = nx.dataset.k; }
    e.target.dispatchEvent(new Event('change', {bubbles:true}));
    if (nextKey) { const el = app.querySelector(`[data-k="${CSS.escape(nextKey)}"]`); if (el) { el.focus(); el.select(); } }
  }
});
app.addEventListener('change', async e => {
  const t = e.target; const pid = S.cur; if (!pid || !S.doc) return;
  if (t.dataset.pred !== undefined) {
    const d = S.doc; const pred = JSON.parse(JSON.stringify(Array.isArray(d.predikat)&&d.predikat.length===4 ? d.predikat : DEF_PRED));
    const i = +t.dataset.pred;
    if (t.dataset.f === 'batas') { const n = parseNum(t.value); if (n===null || isNaN(n)) { t.classList.add('bad'); toast('Batas predikat harus angka'); return; } pred[i].batas = n; }
    else pred[i].label = t.value.trim() || DEF_PRED[i].label;
    t.classList.remove('bad'); upd({predikat: pred}); return;
  }
  const k = t.dataset.k; if (!k) return;
  if (t.dataset.sent === t.value) return; t.dataset.sent = t.value;
  let v = t.value;
  if (t.dataset.t === 'num') {
    v = parseNum(v);
    const max = t.dataset.max !== undefined ? +t.dataset.max : null;
    if (Number.isNaN(v) || (v!==null && (v<0 || (max!==null && v>max)))) { delete t.dataset.sent; t.classList.add('bad'); toast(max!==null ? `Isi angka 0 sampai ${max}` : 'Isi angka yang valid'); return; }
    t.classList.remove('bad');
  } else v = v.trim();
  delete S.drafts[k];
  upd(nest(k, v));
});
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, pid = S.cur, d = S.doc;
  const maxUrut = m => Math.max(0, ...list(m).map(x => x.urut||0));
  switch (a) {
    case 'home': case 'logout':
      if (S.view === 'doc' && (S.pending || S.inflight || S.saving === 'error') && !confirm('Masih ada perubahan yang belum tersimpan. Tetap keluar?')) break;
      leave(); break;
    case 'reload': S.list = null; render(); loadList(); break;
    case 'retry': flush(); break;
    case 'open': enter(id); break;
    case 'new': S.view = 'new'; render(); window.scrollTo(0,0); break;
    case 'tab': S.tab = id; render(); break;
    case 'goK': S.kSel = id; S.tab = 'nilai'; render(); break;
    case 'kSel': S.kSel = id; render(); break;
    case 'delP':
      if (!confirm(`Hapus “${d.judul}” beserta semua peserta dan nilainya? Tindakan ini tidak bisa dibatalkan.`)) break;
      try { await api({action:'delete', id:pid}); toast('Pelatihan dihapus'); S.pending = null; leave(); } catch(err){ toast(err.message); }
      break;
    case 'kAdd': { const kid = uid('k'); upd({komponen:{[kid]:{kode:'MP.'+(new Set(list(d.komponen).map(x=>x.kode)).size+1), nama:'', jenis:'', fasilitator:'', bobot:null, urut:maxUrut(d.komponen)+1}}}); break; }
    case 'kTwin': {
      const src = d.komponen[id]; const kom = list(d.komponen); const i = kom.findIndex(x=>x.id===id);
      const kid = uid('k'); const patch = {komponen:{[kid]:{kode:src.kode, nama:src.nama, jenis:'', fasilitator:src.fasilitator||'', bobot:src.bobot??null, urut:(src.urut||0)+0.5}}};
      // renumber to keep integers
      const after = kom.slice(i+1); after.forEach((x,j) => patch.komponen[x.id] = {urut:(src.urut||0)+2+j}); patch.komponen[kid].urut = (src.urut||0)+1;
      upd(patch); break; }
    case 'kUp': case 'kDown': {
      const kom = list(d.komponen); const i = kom.findIndex(x=>x.id===id); const j = a==='kUp' ? i-1 : i+1; if (j<0 || j>=kom.length) break;
      const patch = {komponen:{}}; kom.forEach((x,n) => patch.komponen[x.id] = {urut:n+1}); patch.komponen[kom[i].id].urut = j+1; patch.komponen[kom[j].id].urut = i+1;
      upd(patch); break; }
    case 'kDel': {
      const k = d.komponen[id]; const n = Object.values((d.nilai||{})[id]||{}).filter(isNum).length;
      if (!confirm(`Hapus komponen ${k.kode||''} ${k.jenis||''}?${n?` ${n} nilai yang sudah diisi ikut terhapus.`:''}`)) break;
      upd({komponen:{[id]:null}, nilai:{[id]:null}}); break; }
    case 'pAdd': { const nid = uid('s'); upd({peserta:{[nid]:{nama:'', instansi:'', profesi:'', pre:null, post:null, hadir:null, urut:maxUrut(d.peserta)+1}}});
      setTimeout(() => { const el = app.querySelector(`[data-k="peserta/${nid}/nama"]`); el && el.focus(); }, 80); break; }
    case 'pDel': { const p = d.peserta[id]; if (confirm(`Hapus peserta ${p.nama||'ini'}? Nilainya ikut tidak dihitung.`)) upd({peserta:{[id]:null}}); break; }
    case 'pSort': { const pes = list(d.peserta).sort((x,y) => (x.nama||'').localeCompare(y.nama||'', 'id')); const patch = {peserta:{}}; pes.forEach((x,i) => patch.peserta[x.id] = {urut:i+1}); upd(patch); toast('Peserta diurutkan berdasarkan nama'); break; }
    case 'pPaste': {
      const ta = document.getElementById('pastePes'); const lines = ta.value.split(/\r?\n/).filter(l => l.trim());
      let u = maxUrut(d.peserta); const patch = {peserta:{}}; let n = 0, bad = 0;
      lines.forEach(l => {
        const c = l.split('\t').map(s => s.trim());
        if (!c[0] || /^nama/i.test(c[0])) return;
        const num = x => { const v = parseNum(x); if (Number.isNaN(v) || (v!==null && (v<0||v>100))) { bad++; return null; } return v; };
        patch.peserta[uid('s')+n] = {nama:c[0], instansi:c[1]||'', profesi:c[2]||'', pre:num(c[3]), post:num(c[4]), hadir:num(c[5]), urut:++u}; n++;
      });
      if (!n) { toast('Tidak ada baris yang terbaca. Salin langsung dari sel Excel.'); break; }
      upd(patch); { const t2 = document.getElementById(ta.id); if (t2) t2.value = ''; } toast(`${n} peserta ditambahkan${bad?`, ${bad} nilai tidak valid dikosongkan`:''}`); break; }
    case 'nPaste': {
      const ta = document.getElementById('pasteNil'); const c = hitung(d); const lines = ta.value.replace(/\r/g,'').split('\n');
      while (lines.length && !lines[lines.length-1].trim()) lines.pop();
      if (lines.length > c.rows.length) { toast(`Ada ${lines.length} baris, peserta hanya ${c.rows.length}. Periksa lagi.`); break; }
      const patch = {}; let n = 0, bad = 0;
      lines.forEach((l,i) => { const v = parseNum(l.split('\t')[0]); if (v===null) return; if (Number.isNaN(v) || v<0 || v>100) { bad++; return; } patch[c.rows[i].p.id] = v; n++; });
      upd({nilai:{[S.kSel]:patch}}); { const t2 = document.getElementById(ta.id); if (t2) t2.value = ''; } toast(`${n} nilai diisi${bad?`, ${bad} baris dilewati karena bukan angka 0–100`:''}`); break; }
    case 'export': exportXlsx(); break;
  }
});


app.addEventListener('submit', async ev => {
  const f = ev.target; const kind = f.dataset.form; if (!kind) return; ev.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  if (kind === 'new') {
    S.busy = true; render();
    try {
      const j = await api({action:'create', judul:v.judul.trim(), copyFrom:v.copy||null});
      S.busy = false;
      S.cur = j.id; S.doc = j.doc; S.view = 'doc'; S.tab = 'pengaturan'; S.drafts = {};
      render(); window.scrollTo(0,0); toast(v.copy ? 'Pelatihan dibuat dari salinan. Periksa tanggal dan mata pelatihan.' : 'Pelatihan dibuat. Lengkapi pengaturannya.');
    } catch(err){ S.busy = false; render(); toast(err.message); }
    return;
  }
});
/* ---------- export ---------- */
async function exportXlsx(){
  const d = S.doc; if (!d) return;
  if (!window.XLSX) { toast('Pembuat file Excel belum termuat. Coba lagi sebentar.'); return; }
  const c = hitung(d); const r2 = n => isNum(n) ? Math.round(n*100)/100 : '';
  const head = ['No','Nama Lengkap','Asal Instansi','Profesi','Pre Test','Post Test','Progress (%)', ...c.kom.map(k => `${k.kode} ${k.jenis||''}`.trim()), 'Rata-rata Penugasan','Kehadiran (%)','Nilai Akhir','Predikat','Status','Peringkat','Kelengkapan'];
  const aoa = [['REKAPITULASI EVALUASI PESERTA'],[d.judul||''],[d.penyelenggara||''],[[d.tanggal?'Tanggal '+d.tanggal:'', d.tempat||''].filter(Boolean).join(', ')],[], head,
    ...c.rows.map(r => [r.no, r.p.nama, r.p.instansi||'', r.p.profesi||'', r2(r.pre), r2(r.post), r2(r.prog), ...r.vals.map(r2), r2(r.pen), r2(r.had), r2(r.na), r.predikat, r.status, r.rank??'', r.miss?`Kurang ${r.miss} nilai`:'Lengkap'])];
  aoa.push([]);
  [['Terendah','min'],['Tertinggi','max'],['Rata-rata','avg']].forEach(([l,k]) => aoa.push(['',l,'','', r2(c.cols.pre[k]), r2(c.cols.post[k]), r2(c.cols.prog[k]), ...c.cols.kom.map(s=>r2(s[k])), r2(c.cols.pen[k]), r2(c.cols.had[k]), r2(c.cols.na[k])]));
  aoa.push([], ['Keterangan mata pelatihan'], ...[...new Map(c.kom.map(k=>[k.kode+'|'+k.nama,k])).values()].map(k => [k.kode, k.nama]));
  const ws1 = XLSX.utils.aoa_to_sheet(aoa);
  ws1['!cols'] = head.map((h,i) => ({wch: i===0?5 : i<4?32 : 12}));
  const nNA = c.cols.na.n;
  const sum = [['RINGKASAN HASIL PENILAIAN'],[d.judul||''],[],
    ['Jumlah peserta', c.rows.length],['Lulus', c.rows.filter(r=>r.status==='Lulus').length],['Tidak Lulus', c.rows.filter(r=>r.status==='Tidak Lulus').length],['Nilai belum lengkap', c.rows.filter(r=>r.miss).length],[],
    ['Bobot nilai akhir', `Post Test ${c.B.post||0}%, Penugasan ${c.B.pen||0}%, Kehadiran ${c.B.had||0}%`],['Lulus jika nilai akhir di atas', c.lulus],[],
    ['Distribusi predikat','Jumlah','%'], ...c.pred.map((p,i) => [p.label, c.dist[i], nNA ? Math.round(c.dist[i]/nNA*1000)/10 : '']).reverse(),[],
    ['Peserta terbaik','Nama','Asal Instansi','Post Test','Rata-rata Penugasan','Nilai Akhir'], ...c.best.map((r,i) => [i+1, r.p.nama, r.p.instansi||'', r2(r.post), r2(r.pen), r2(r.na)]),[],
    ['Komponen','Jenis','Nama Mata Pelatihan','Terendah','Tertinggi','Rata-rata'],
    ['Pre Test','','',r2(c.cols.pre.min),r2(c.cols.pre.max),r2(c.cols.pre.avg)],['Post Test','','',r2(c.cols.post.min),r2(c.cols.post.max),r2(c.cols.post.avg)],
    ['Progress (%)','','',r2(c.cols.prog.min),r2(c.cols.prog.max),r2(c.cols.prog.avg)],
    ...c.kom.map((k,j) => [k.kode, k.jenis||'', k.nama, r2(c.cols.kom[j].min), r2(c.cols.kom[j].max), r2(c.cols.kom[j].avg)]),
    ['Rata-rata Penugasan','','',r2(c.cols.pen.min),r2(c.cols.pen.max),r2(c.cols.pen.avg)],['Nilai Akhir','','',r2(c.cols.na.min),r2(c.cols.na.max),r2(c.cols.na.avg)]];
  const ws2 = XLSX.utils.aoa_to_sheet(sum); ws2['!cols'] = [{wch:28},{wch:32},{wch:40},{wch:12},{wch:14},{wch:12}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws1, 'Rekap'); XLSX.utils.book_append_sheet(wb, ws2, 'Ringkasan');
  const name = ('Rekap Nilai - ' + (d.judul||'Pelatihan')).replace(/[\\/:*?"<>|]/g,'').slice(0,90) + '.xlsx';
  XLSX.writeFile(wb, name);
}

/* ---------- boot ---------- */
render(); loadList();
if (location.hash.length > 1) enter(decodeURIComponent(location.hash.slice(1)));
})();
</script>
