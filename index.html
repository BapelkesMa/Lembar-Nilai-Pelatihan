<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Lembar Penilaian Pelatihan – Bapelkes Mataram</title>

<style>
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#14302E; --muted:#5C716F; --line:#D8E2E0;
  --teal:#0F7C78; --teal-ink:#0B4F4C; --teal-soft:#E2F1EF; --amber:#A8670F; --amber-soft:#FBEFD6;
  --red:#B4382E; --red-soft:#F8E3E0; --green:#2C7A44; --green-soft:#E1F2E6; --input:#FFFCEE; --input-line:#E6D9A8;
  --shadow:0 1px 0 rgba(20,48,46,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1918; --surface:#142322; --ink:#E3EDEB; --muted:#94AAA7; --line:#2A3E3C;
  --teal:#43B5AE; --teal-ink:#9ADBD5; --teal-soft:#173533; --amber:#E2AA4E; --amber-soft:#3A2D15;
  --red:#E57A6F; --red-soft:#3B201D; --green:#70C68D; --green-soft:#183022; --input:#1D2A22; --input-line:#3D4A33;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0E1918; --surface:#142322; --ink:#E3EDEB; --muted:#94AAA7; --line:#2A3E3C;
  --teal:#43B5AE; --teal-ink:#9ADBD5; --teal-soft:#173533; --amber:#E2AA4E; --amber-soft:#3A2D15;
  --red:#E57A6F; --red-soft:#3B201D; --green:#70C68D; --green-soft:#183022; --input:#1D2A22; --input-line:#3D4A33;
  --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:none;margin:0;padding:0 clamp(16px,2.6vw,56px)}
@media (min-width:1400px){html{zoom:1.1}}
@media (min-width:1800px){html{zoom:1.2}}
@media (min-width:2400px){html{zoom:1.4}}
header.top{background:var(--band);color:var(--on-band);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
header.top .btn{background:transparent;border-color:rgba(255,255,255,.28);color:var(--on-band)}
header.top .btn:hover{border-color:#fff}
header.top .btn.ghost{border-color:transparent;color:rgba(255,255,255,.8)}
header.top .pill{background:rgba(255,255,255,.14);color:var(--on-band)}
header.top .pill.ok{background:rgba(120,220,160,.22);color:#D7F5E2}
header.top .pill.warn{background:#F6D58C;color:#5A3B00}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;color:var(--on-band)}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--teal);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.brand .mark i{background:rgba(255,255,255,.85);border-radius:1px}
.brand .mark i:nth-child(2n){opacity:.45}
.brand small{display:block;font-weight:500;color:rgba(255,255,255,.7);font-size:12px;letter-spacing:0;text-align:left}
.brand>span:last-child{text-align:left;line-height:1.25;color:var(--on-band)}
.brand .mark{background:rgba(255,255,255,.16)}
.spacer{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--green-soft);color:var(--green)}
code{background:var(--teal-soft);padding:1px 5px;border-radius:4px;font-size:.92em}
main{padding:28px 0 64px}
h1{font-size:clamp(22px,3.2vw,32px);line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;font-weight:800;max-width:30ch}
h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#062220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#062220}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.stack>*+*{margin-top:18px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;font-weight:400;color:var(--ink)}
.in::placeholder{color:var(--muted);opacity:.65}
input.in,select.in,textarea.in{background:var(--input);border:1px solid var(--input-line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input.in:disabled{background:transparent;border-color:var(--line)}
input.num{text-align:center;font-variant-numeric:tabular-nums;max-width:90px}
input.bad{border-color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--teal-ink);border-bottom-color:var(--teal)}
.tabs .cnt{font-size:11px;background:var(--teal-soft);color:var(--teal-ink);border-radius:99px;padding:1px 7px;margin-left:6px}
.scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13.5px}
thead th{background:var(--teal-soft);color:var(--teal-ink);font-weight:700;font-size:12.5px;position:sticky;top:0;z-index:1}
td.c,th.c{text-align:center}
td.n{text-align:right}
tbody tr:hover td{background:color-mix(in srgb,var(--teal-soft) 40%,transparent)}
tfoot td{background:var(--bg);font-weight:700}
.sticky{position:sticky;left:0;background:var(--surface);z-index:2}
thead .sticky{background:var(--teal-soft);z-index:3}
tfoot .sticky{background:var(--bg)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.no{background:var(--red-soft);color:var(--red)}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.neg{color:var(--red)}
tr.ghost td{background:color-mix(in srgb,var(--teal-soft) 35%,transparent)}
tr.ghost input.in{background:var(--surface);border-style:dashed}
.prov{font-size:11px;font-weight:600;color:var(--amber);text-transform:none}
.tag.provt{outline:1.5px dashed currentColor;outline-offset:1px}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;background:var(--amber-soft);color:var(--amber)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.pcard h3{font-size:16px;line-height:1.3;margin:0}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:99px}
.meter.full i{background:var(--green)}
/* the ledger: completion strip per penilaian */
.ledger{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.lg{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.lg:hover{border-color:var(--teal)}
.lg b{font-size:13px;line-height:1.25}
.lg span{font-size:12px;color:var(--muted)}
.lg .cells{display:flex;flex-wrap:wrap;gap:2px}
.lg .cells i{width:7px;height:10px;border-radius:2px;background:var(--line)}
.lg .cells i.on{background:var(--teal)}
.lg.done .cells i.on{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#062220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#062220}}
.chip small{opacity:.75;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.dist{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:8px 0 10px}
.dist i{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;font-style:normal;min-width:0;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.podium{list-style:none;padding:0;margin:0}
.podium li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.podium li:last-child{border-bottom:0}
.podium .rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--teal-soft);color:var(--teal-ink)}
.podium li:first-child .rk{background:var(--amber);color:#fff}
.podium .sc{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:50;max-width:90vw}
details.paste{margin-top:14px}
details.paste summary{cursor:pointer;font-weight:600;color:var(--teal-ink);font-size:14px}
details.paste textarea{min-height:140px;font-family:inherit;margin:10px 0}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.kode{font-weight:700;color:var(--teal-ink)}
.saving{font-size:12px;color:var(--muted)}

/* bands & home */
:root{--band:#0B4F4C;--band-2:#0F6460;--on-band:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--band:#0C2B29;--band-2:#123B38}}
:root[data-theme="dark"]{--band:#0C2B29;--band-2:#123B38}
.hero{background:linear-gradient(180deg,var(--band) 0%,var(--band-2) 100%);color:var(--on-band);padding:36px 0 58px}
.hero-in{display:block}
.hero h1{color:#fff;font-size:clamp(26px,3.4vw,40px);max-width:24ch;margin-bottom:12px}
.hero p{color:rgba(255,255,255,.82);max-width:68ch;font-size:16px;margin-bottom:22px}
.btn.light{background:#fff;color:var(--band);border-color:#fff}
.btn.light:hover{background:#E8F5F3}
.btn.lg{padding:11px 20px;font-size:15px}
.hero .hint{font-size:13px;color:rgba(255,255,255,.65);margin-top:12px}
.sheet{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 16px 12px;backdrop-filter:blur(2px)}
.sheet .sh-h{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);margin-bottom:10px}
.sheet .sh-r{display:grid;grid-template-columns:22px 1fr repeat(5,26px) 62px;gap:5px;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.08)}
.sheet .sh-r b{font-size:11px;color:rgba(255,255,255,.55);font-weight:600;text-align:center}
.sheet .nm{height:8px;border-radius:4px;background:rgba(255,255,255,.35)}
.sheet .cl{height:18px;border-radius:4px;background:#7FD3C9}
.sheet .tg{font-size:10.5px;font-weight:700;text-align:center;border-radius:99px;padding:2px 0;background:#CDEFD8;color:#1F5C33}
.sheet .tg.top{background:#F6D58C;color:#5A3B00}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:-30px;position:relative}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;box-shadow:0 6px 18px rgba(11,79,76,.08)}
.step .n{width:34px;height:34px;border-radius:9px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-weight:800}
.step b{display:block;font-size:14.5px;margin-bottom:2px}
.step span{font-size:13px;color:var(--muted);line-height:1.45}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.sec-h h2{font-size:20px;margin:0}
.sec-h .cnt{font-size:12px;background:var(--teal-soft);color:var(--teal-ink);border-radius:99px;padding:2px 9px;font-weight:700}
.search{max-width:280px}
.pcard{position:relative;overflow:hidden;padding-top:22px}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--teal)}
.pcard .meta{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.pcard .meta b{color:var(--ink);font-size:15px;margin-right:3px}
.pcard:hover{border-color:var(--teal)}
.empty.compact{padding:28px 20px;display:flex;gap:18px;align-items:center;justify-content:space-between;text-align:left;flex-wrap:wrap;background:var(--surface)}
footer.foot{border-top:1px solid var(--line);padding:18px 0 28px;font-size:12.5px;color:var(--muted)}
.rng{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.idgrid{display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1.2fr;gap:0 16px;margin-top:6px}
@media (max-width:1100px){.idgrid{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:900px){.idgrid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.idgrid{grid-template-columns:1fr}}
.dochead{background:var(--surface);border-bottom:1px solid var(--line);padding:24px 0 20px}
.dochead h1{margin-bottom:4px}
.dochead .ledger{margin-top:16px}
.dochead + main{padding-top:0}
@media (max-width:860px){ .hero-in{grid-template-columns:1fr} .hero-art{display:none} .steps{grid-template-columns:1fr;margin-top:-24px} .hero{padding:32px 0 46px} }

.cellw{position:relative;display:inline-block}
.fh{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--teal);border:2px solid var(--surface);border-radius:3px;cursor:ns-resize;touch-action:none;z-index:2}
.fh.demo{position:relative;display:inline-block;right:auto;bottom:auto;vertical-align:-1px;cursor:default}
tr.fillsel input.in{background:var(--teal-soft);border-color:var(--teal)}
.nilaigrid{display:grid;grid-template-columns:minmax(0,640px) minmax(240px,1fr);gap:20px;align-items:start}
@media (max-width:900px){.nilaigrid{grid-template-columns:1fr}.nilaigrid .guide{order:-1}}
.guide{background:var(--teal-soft);border-radius:10px;padding:14px 16px;font-size:13.5px;position:sticky;top:76px}
.guide ol{margin:8px 0 10px;padding-left:20px}
.guide li{margin-bottom:6px}
kbd{font:inherit;font-size:12px;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.share{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--teal);border-radius:10px;padding:12px 14px;margin:6px 0 16px;background:color-mix(in srgb,var(--teal-soft) 45%,transparent)}
.share b{display:block;font-size:14px}
.share span{font-size:13px;color:var(--muted)}
@media (max-width:640px){ .wrap{padding:0 14px} .panel{padding:16px} th,td{padding:6px 7px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

<div id="app"></div>
<script>
(function(){
"use strict";
/* ===================== KONFIGURASI ===================== */
/* Tempel URL Web App Google Apps Script di sini (berakhiran /exec) */
const API_URL = 'https://script.google.com/macros/s/AKfycbzOExGNZBpCj6_Y49XM-xj9OMRNa_lOBKsywDUaJf0ckCOFMmMH04L0ySe_v4aXKAIb/exec';
/* ======================================================= */

const app = document.getElementById('app');
const S = { list:null, listErr:null, view:'home', cur:null, doc:null, q:'',
  tab:'pengaturan', kSel:null, drafts:{}, toast:null,
  pending:null, inflight:false, saving:'idle', saveErr:'', savedAt:null, busy:false, seq:0 };
const JENIS = ['Penugasan','Studi Kasus','Roleplay','Praktik','Presentasi','Simulasi','Diskusi Kelompok','Rencana Tindak Lanjut'];
const DEF_PRED = [{batas:null,label:'Kurang Memuaskan'},{batas:70,label:'Cukup Memuaskan'},{batas:80,label:'Memuaskan'},{batas:90,label:'Sangat Memuaskan'}];
const PRED_COL = ['var(--red)','var(--amber)','var(--teal)','var(--green)'];
const isP = () => true;
const canNil = () => true;
const canEdit = k => true;

/* ---------- helpers ---------- */
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = x => typeof x === 'number' && isFinite(x);
const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,6);
const fmt = (n,d=2) => isNum(n) ? n.toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}) : '–';
const fmtIn = n => isNum(n) ? String(Math.round(n*100)/100).replace('.',',') : '';
const parseNum = s => { s = String(s ?? '').trim().replace(/\s/g,'').replace(',','.'); if(s==='') return null; const n = Number(s); return isFinite(n) ? n : NaN; };
const list = m => Object.entries(m || {}).filter(([,v]) => v && typeof v === 'object').map(([id,v]) => ({...v, id})).sort((a,b) => (a.urut ?? 0) - (b.urut ?? 0) || a.id.localeCompare(b.id));
const nest = (path, val) => path.split('/').reduceRight((acc,k) => ({[k]:acc}), val);
function deepMerge(a, b){
  const out = (a && typeof a === 'object' && !Array.isArray(a)) ? {...a} : {};
  for (const [k,v] of Object.entries(b)) {
    out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(out[k], v) : v;
  }
  return out;
}
const stat = arr => { const a = arr.filter(isNum); if(!a.length) return {min:null,max:null,avg:null,n:0}; return {min:Math.min(...a),max:Math.max(...a),avg:a.reduce((s,x)=>s+x,0)/a.length,n:a.length}; };
function toast(msg){ S.toast = msg; paintToast(); clearTimeout(toast.t); toast.t = setTimeout(()=>{ S.toast=null; paintToast(); }, 3200); }
function paintToast(){ let el = document.getElementById('toast'); if(!S.toast){ el && el.remove(); return; } if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent = S.toast; }

/* ---------- tanggal & rentang ---------- */
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_RX = {januari:1,februari:2,maret:3,april:4,mei:5,juni:6,juli:7,agustus:8,september:9,oktober:10,november:11,desember:12,agust:8,agt:8,ags:8,jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,sep:9,sept:9,okt:10,nov:11,des:12};
function isoTgl(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function fmtTgl(iso){ const [y,m,d] = iso.split('-').map(Number); return `${d} ${BULAN[m-1]} ${y}`; }
function parseTgl(txt){
  const out = []; const rx = /(\d{1,2})\s*([A-Za-z]+)\.?\s*(\d{4})?/g; let m;
  while ((m = rx.exec(String(txt||'')))) { const mo = BULAN_RX[m[2].toLowerCase()]; if (mo) out.push({d:+m[1], m:mo, y:m[3]?+m[3]:null}); }
  for (let i = out.length-1; i >= 0; i--) if (!out[i].y && out[i+1]) out[i].y = out[i+1].y;
  const ok = out.filter(x => x.y).map(x => isoTgl(x.y, x.m, x.d));
  return [ok[0]||'', ok[1]||ok[0]||''];
}
function tglText(a,b){ if (!a && !b) return ''; if (!a || !b || a===b) return fmtTgl(a||b); return `${fmtTgl(a)} s/d ${fmtTgl(b)}`; }
function predOf(d){ return (Array.isArray(d.predikat) && d.predikat.length===4) ? d.predikat : DEF_PRED; }
function rentang(pred, i){ const lo = i===0 ? 0 : pred[i].batas; const hi = i===3 ? 100 : Math.round((pred[i+1].batas - 0.01)*100)/100; return [lo, hi]; }
function rentangTxt(pred, i){ const [lo,hi] = rentang(pred,i); return `${fmt(lo)} – ${fmt(hi)}`; }

  catch(e){ throw new Error('Tidak terhubung ke server. Periksa koneksi internet.'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('Jawaban server tidak terbaca. Periksa URL Web App.'); }
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan di server.');
  return j;
}

/* write queue: optimistic local change, then sequential saves */
function upd(obj){
  if (!S.doc) return;
  S.doc = deepMerge(S.doc, obj);
  S.pending = S.pending ? deepMerge(S.pending, obj) : obj;
  render(); flush();
}
async function flush(){
  if (S.inflight || !S.pending || !S.cur) return;
  const patch = S.pending; S.pending = null; S.inflight = true; S.saving = 'saving'; S.seq++; paintStatus();
  try {
    const j = await api({action:'save', id:S.cur, patch});
    S.doc = S.pending ? deepMerge(j.doc, S.pending) : j.doc;
    S.saving = 'saved'; S.savedAt = new Date();
  } catch(e){
    S.pending = S.pending ? deepMerge(patch, S.pending) : patch;
    S.saving = 'error'; S.saveErr = e.message; toast('Belum tersimpan: ' + e.message);
    clearTimeout(flush.t); flush.t = setTimeout(() => { if (S.saving === 'error') flush(); }, 8000);
  }
  S.inflight = false; render();
  if (S.pending && S.saving !== 'error') flush();
}
async function poll(){
  if (!S.cur || !S.doc || S.pending || S.inflight || drag || document.visibilityState !== 'visible') return;
  const seq = S.seq;
  try {
    const j = await api({action:'get', id:S.cur});
    if (seq === S.seq && !S.pending && !S.inflight) { S.doc = j.doc; render(); }
  } catch(e){ if (/tidak ditemukan/i.test(e.message)) { toast('Pelatihan ini sudah dihapus.'); leave(); } }
}
setInterval(poll, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
window.addEventListener('beforeunload', e => {
  if (S.pending || S.inflight || S.saving === 'error' || Object.keys(S.drafts).length) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- calculation ---------- */
function hitung(d){
  const B = d.bobot || {post:30,pen:70,had:0};
  const bp=(+B.post||0)/100, bt=(+B.pen||0)/100, bk=(+B.had||0)/100;
  const pred = (Array.isArray(d.predikat) && d.predikat.length===4) ? d.predikat : DEF_PRED;
  const lulus = isNum(d.lulus) ? d.lulus : 70;
  const hadMin = isNum(d.hadirMin) ? d.hadirMin : null;
  const kom = list(d.komponen).filter(k => (k.kode||'').trim() || (k.nama||'').trim()).map(k => ({...k, w: isNum(k.bobot) ? k.bobot : 1}));
  const pes = list(d.peserta).filter(p => (p.nama||'').trim());
  const needHad = bk>0 || hadMin!==null;
  const rows = pes.map((p,i) => {
    const pre = isNum(p.pre)?p.pre:null, post = isNum(p.post)?p.post:null, had = isNum(p.hadir)?p.hadir:null;
    const prog = (pre!==null && post!==null && pre<100) ? (post-pre)/(100-pre)*100 : null;
    const vals = kom.map(k => { const v = d.nilai && d.nilai[k.id] && d.nilai[k.id][p.id]; return isNum(v)?v:null; });
    let s=0, sw=0; vals.forEach((v,j) => { if(v!==null && kom[j].w>0){ s+=v*kom[j].w; sw+=kom[j].w; } });
    const pen = sw>0 ? s/sw : null;
    // nilai akhir dihitung dari komponen yang sudah masuk; bobot disesuaikan bila ada yang belum terisi
    let sv = 0, sb = 0;
    if (bp>0 && post!==null) { sv += post*bp; sb += bp; }
    if (bt>0 && pen!==null) { sv += pen*bt; sb += bt; }
    if (bk>0 && had!==null) { sv += had*bk; sb += bk; }
    const na = sb>0 ? Math.round(sv/sb*100)/100 : null;
    let pi = null, predikat = '';
    if (na!==null){ pi = [1,2,3].filter(j => isNum(pred[j].batas) && pred[j].batas <= na).length; predikat = pred[pi].label; }
    const status = na===null ? '' : ((na >= lulus && (hadMin===null || had===null || had >= hadMin)) ? 'Lulus' : 'Tidak Lulus');
    const miss = kom.filter((k,j) => k.w>0 && vals[j]===null).length + (pre===null) + (post===null) + (needHad && had===null);
    return {no:i+1, p, pre, post, had, prog, vals, pen, na, pi, predikat, status, miss, prov: na!==null && miss>0};
  });
  rows.forEach(r => { r.rank = r.na===null ? null : 1 + rows.filter(o => o.na!==null && o.na > r.na).length; });
  const best = rows.filter(r => r.status==='Lulus').sort((a,b) => b.na-a.na || (b.post||0)-(a.post||0) || a.no-b.no).slice(0, Math.max(1, Math.min(10, d.nTop||3)));
  const cols = {pre: stat(rows.map(r=>r.pre)), post: stat(rows.map(r=>r.post)), prog: stat(rows.map(r=>r.prog)),
    kom: kom.map((k,j) => stat(rows.map(r=>r.vals[j]))), pen: stat(rows.map(r=>r.pen)), had: stat(rows.map(r=>r.had)), na: stat(rows.map(r=>r.na))};
  const dist = pred.map((x,i) => rows.filter(r => r.pi===i).length);
  const totalB = (+B.post||0)+(+B.pen||0)+(+B.had||0);
  return {kom, pes, rows, best, cols, dist, pred, lulus, hadMin, B, totalB, needHad};
}

/* ---------- render ---------- */
function render(){
  const a = document.activeElement, key = a && a.dataset && (a.dataset.k || (a.dataset.pred!==undefined ? 'pred'+a.dataset.pred+a.dataset.f : null));
  const ss = a && a.selectionStart, se = a && a.selectionEnd;
  const scrolls = {}; app.querySelectorAll('[data-scroll]').forEach(el => scrolls[el.dataset.scroll] = el.scrollLeft);
  const paste = {}; app.querySelectorAll('textarea[id]').forEach(t => paste[t.id] = t.value);
  const open = {}; app.querySelectorAll('details.paste').forEach((dt,i) => open[i] = dt.open);
  const formVals = {}; app.querySelectorAll('form[data-form] [name]').forEach(el => formVals[el.closest('form').dataset.form+':'+el.name] = el.value);
  const aid = a && a.id === 'q' ? 'q' : null;
  const ghostKey = a && a.dataset && a.dataset.new ? a.dataset.new : null;
  const ghostVals = {}; app.querySelectorAll('[data-new]').forEach(el => { if (el.value) ghostVals[el.dataset.new] = el.value; });
  const focusName = a && a.name && a.closest && a.closest('form[data-form]') ? a.closest('form').dataset.form+':'+a.name : null;
  const body = (S.view==='fasil' && S.doc) ? viewFasil() : (S.view==='doc' && S.doc) ? viewPelatihan() : S.view==='new' ? viewNew() : viewHome();
  app.innerHTML = header() + body;
  app.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollLeft = scrolls[el.dataset.scroll]; });
  app.querySelectorAll('textarea[id]').forEach(t => { if (paste[t.id]) t.value = paste[t.id]; });
  app.querySelectorAll('details.paste').forEach((dt,i) => { if (open[i] !== undefined) dt.open = open[i]; });
  app.querySelectorAll('form[data-form] [name]').forEach(el => { const k = el.closest('form').dataset.form+':'+el.name; if (formVals[k] !== undefined) el.value = formVals[k]; if (k === focusName) el.focus(); });
  if (key) {
    const el = key.startsWith('pred') && !app.querySelector(`[data-k="${CSS.escape(key)}"]`)
      ? app.querySelector(`[data-pred="${key[4]}"][data-f="${key.slice(5)}"]`)
      : app.querySelector(`[data-k="${CSS.escape(key)}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch(e){} }
  }
  app.querySelectorAll('[data-new]').forEach(el => { if (ghostVals[el.dataset.new] !== undefined && !S.ghostFocus) el.value = ghostVals[el.dataset.new]; });
  if (key) { /* handled above */ } else if (S.ghostFocus) {
    const el = S.ghostFocus === 'ghost' ? app.querySelector('[data-new="nama"]') : app.querySelector(`[data-k="${CSS.escape(S.ghostFocus)}"]`);
    if (el) { el.focus(); S.ghostFocus = null; }
  } else if (ghostKey) { const el = app.querySelector(`[data-new="${ghostKey}"]`); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch(e){} }
  } else if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch(e){} } }
}

/* ---------- events ---------- */
app.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); return; } const k = e.target.dataset.k; if (k) S.drafts[k] = e.target.value; });
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.new) {
    e.preventDefault(); S.enterGhost = true;
    e.target.dispatchEvent(new Event('change', {bubbles:true}));
    S.enterGhost = false; return;
  }
  if (e.key === 'Enter' && e.target.matches('input.in') && !e.target.closest('form')) {
    e.preventDefault();
    let nextKey = null;
    const td = e.target.closest('td'), tr = td && td.parentElement;
    if (tr && tr.nextElementSibling) { const ni = tr.nextElementSibling.children[td.cellIndex]; const nx = ni && ni.querySelector('input.in[data-k]:not([disabled])'); if (nx) nextKey = nx.dataset.k; }

/* ---------- tempel kolom & tarik ke bawah ---------- */
function pastePeserta(e){
  const t = e.target; const text = (e.clipboardData || window.clipboardData).getData('text') || '';
  const lines = text.replace(/\r/g,'').split('\n'); while (lines.length && !lines[lines.length-1].trim()) lines.pop();
  const grid = lines.map(l => l.split('\t'));
  if (!grid.length || (grid.length === 1 && grid[0].length === 1)) return;   // satu sel: tempel biasa
  e.preventDefault();
  const field = t.dataset.new || t.dataset.k.split('/')[2]; const c0 = PF.indexOf(field);
  if (c0 === 0 && /^nama/i.test((grid[0][0]||'').trim())) grid.shift();      // lewati baris judul
  const tr = t.closest('tr'); const r0 = [...tr.parentElement.rows].indexOf(tr);
  const pes = list(S.doc.peserta); let u = Math.max(0, ...pes.map(x => x.urut||0));
  const patch = {peserta:{}}; let nNew = 0, nUpd = 0, bad = 0;
  grid.forEach((cells, j) => {
    if (cells.every(x => !x.trim())) return;
    const ri = r0 + j; let id, obj;
    if (ri < pes.length) { id = pes[ri].id; obj = {}; nUpd++; }
    else { id = uid('s') + j; obj = {nama:'', instansi:'', profesi:'', pre:null, post:null, hadir:null, urut:++u}; nNew++; }
    cells.forEach((x, k) => {
      const f = PF[c0 + k]; if (!f) return; x = x.trim(); if (x === '') return;
      if (PF_NUM[f]) { const v = parseNum(x); if (Number.isNaN(v) || v === null || v < 0 || v > 100) { bad++; return; } obj[f] = v; }
      else obj[f] = x.slice(0, 300);
      delete S.drafts[`peserta/${id}/${f}`];
    });
    if (ri >= pes.length && !PF.some(f => obj[f] !== '' && obj[f] !== null && obj[f] !== undefined)) { u--; nNew--; return; }
    patch.peserta[id] = obj;
  });
  if (nNew || nUpd) upd(patch);
  toast([nNew ? `${nNew} peserta baru ditambahkan` : '', nUpd ? `${nUpd} baris diperbarui` : '', bad ? `${bad} nilai bukan angka 0–100 dilewati` : ''].filter(Boolean).join(', ') || 'Tidak ada data yang ditempel');
}
app.addEventListener('paste', e => {
  const t = e.target; if (!t.matches) return;
  if (isP() && t.closest('#pesBody') && t.matches('input.in')) { pastePeserta(e); return; }
  if (!t.matches('input.in[data-k^="nilai/"]')) return;
  const text = (e.clipboardData || window.clipboardData).getData('text') || '';
  const lines = text.replace(/\r/g,'').split('\n'); while (lines.length && !lines[lines.length-1].trim()) lines.pop();
  if (lines.length <= 1) return;
  e.preventDefault();
  const td = t.closest('td'), tr = t.closest('tr'), body = tr.parentElement; const rows = [...body.rows];
  const start = rows.indexOf(tr); let patch = {}, n = 0, bad = 0, over = 0;
  lines.forEach((l, j) => {
    const row = rows[start + j]; if (!row) { over++; return; }
    const el = row.cells[td.cellIndex] && row.cells[td.cellIndex].querySelector('input[data-k]'); if (!el) return;
    const v = parseNum(l.split('\t')[0]); if (v === null) return;
    if (Number.isNaN(v) || v < 0 || v > 100) { bad++; return; }
    patch = deepMerge(patch, nest(el.dataset.k, v)); delete S.drafts[el.dataset.k]; n++;
  });
  if (n) upd(patch);
  toast(`${n} nilai ditempel${bad?`, ${bad} bukan angka 0–100 dilewati`:''}${over?`, ${over} baris melebihi jumlah peserta`:''}`);
});

function endDrag(){

async function exportXlsx(){
  const d = S.doc; if (!d) return;
  if (!window.XLSX) { toast('Pembuat file Excel belum termuat. Coba lagi sebentar.'); return; }
  const c = hitung(d); const r2 = n => isNum(n) ? Math.round(n*100)/100 : '';
  const head = ['No','Nama Lengkap','Asal Instansi','Profesi','Pre Test','Post Test','Progress (%)', ...c.kom.map(k => `${k.kode} ${k.jenis||''}`.trim()), 'Rata-rata Penugasan','Kehadiran (%)','Nilai Akhir','Predikat','Status','Peringkat','Kelengkapan'];
  const aoa = [['REKAPITULASI EVALUASI PESERTA'],[d.judul||''],[d.penyelenggara||''],[[d.tanggal?'Tanggal '+d.tanggal:'', d.tempat||''].filter(Boolean).join(', ')],[], head,
    ...c.rows.map(r => [r.no, r.p.nama, r.p.instansi||'', r.p.profesi||'', r2(r.pre), r2(r.post), r2(r.prog), ...r.vals.map(r2), r2(r.pen), r2(r.had), r2(r.na), r.predikat, r.status, r.rank??'', r.miss?`Kurang ${r.miss} nilai`:'Lengkap'])];
  aoa.push([]);
  [['Terendah','min'],['Tertinggi','max'],['Rata-rata','avg']].forEach(([l,k]) => aoa.push(['',l,'','', r2(c.cols.pre[k]), r2(c.cols.post[k]), r2(c.cols.prog[k]), ...c.cols.kom.map(s=>r2(s[k])), r2(c.cols.pen[k]), r2(c.cols.had[k]), r2(c.cols.na[k])]));
  aoa.push([], ['Keterangan mata pelatihan'], ...[...new Map(c.kom.map(k=>[k.kode+'|'+k.nama,k])).values()].map(k => [k.kode, k.nama]));
  const ws1 = XLSX.utils.aoa_to_sheet(aoa);
  ws1['!cols'] = head.map((h,i) => ({wch: i===0?5 : i<4?32 : 12}));
  const nNA = c.cols.na.n;
  const sum = [['RINGKASAN HASIL PENILAIAN'],[d.judul||''],[],
    ['Jumlah peserta', c.rows.length],['Lulus', c.rows.filter(r=>r.status==='Lulus').length],['Tidak Lulus', c.rows.filter(r=>r.status==='Tidak Lulus').length],['Nilai belum lengkap', c.rows.filter(r=>r.miss).length],[],
    ['Tanggal', d.tanggal||''],['Bobot nilai akhir', `Post Test ${c.B.post||0}%, Penugasan ${c.B.pen||0}%, Kehadiran ${c.B.had||0}%`],['Nilai minimal lulus', c.lulus],[],
    ['Distribusi predikat','Rentang nilai akhir','Jumlah','%'], ...c.pred.map((p,i) => [p.label, rentangTxt(c.pred,i), c.dist[i], nNA ? Math.round(c.dist[i]/nNA*1000)/10 : '']).reverse(),[],
    ['Peserta terbaik','Nama','Asal Instansi','Post Test','Rata-rata Penugasan','Nilai Akhir'], ...c.best.map((r,i) => [i+1, r.p.nama, r.p.instansi||'', r2(r.post), r2(r.pen), r2(r.na)]),[],
    ['Komponen','Jenis','Nama Mata Pelatihan','Terendah','Tertinggi','Rata-rata'],
    ['Pre Test','','',r2(c.cols.pre.min),r2(c.cols.pre.max),r2(c.cols.pre.avg)],['Post Test','','',r2(c.cols.post.min),r2(c.cols.post.max),r2(c.cols.post.avg)],
    ['Progress (%)','','',r2(c.cols.prog.min),r2(c.cols.prog.max),r2(c.cols.prog.avg)],
    ...c.kom.map((k,j) => [k.kode, k.jenis||'', k.nama, r2(c.cols.kom[j].min), r2(c.cols.kom[j].max), r2(c.cols.kom[j].avg)]),
    ['Rata-rata Penugasan','','',r2(c.cols.pen.min),r2(c.cols.pen.max),r2(c.cols.pen.avg)],['Nilai Akhir','','',r2(c.cols.na.min),r2(c.cols.na.max),r2(c.cols.na.avg)]];
  const ws2 = XLSX.utils.aoa_to_sheet(sum); ws2['!cols'] = [{wch:28},{wch:32},{wch:40},{wch:12},{wch:14},{wch:12}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws1, 'Rekap'); XLSX.utils.book_append_sheet(wb, ws2, 'Ringkasan');
